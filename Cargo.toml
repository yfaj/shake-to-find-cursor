[package]
name = "shake-to-find-cursor"
version = "0.1.0"
edition = "2024"
description = "macOS-style shake-to-find cursor for Windows. Native, single exe."

[dependencies]
windows-link = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts", "glow", "wayland", "x11", "accesskit", "persistence",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Dwm",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
